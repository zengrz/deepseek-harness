# The dsh-matrix-theme bundle patch: one insert adding the Matrix theme
# browser row to a browser-surface profile. Applied after the profile's other
# bundles (typically dsh-web-app), so a web-app layer from before the theme
# shipped in-box gains the row here.
#
# The insert form appends; it does not dedupe. A profile whose layers already
# register `ui-matrix-theme` (the dsh-web-app bundle from the release that
# shipped the theme onward) fails the load with `duplicate loader entry id:
# ui-matrix-theme`, so this bundle is for rosters that lack the row — custom
# browser-surface compositions and web-app versions that predate the theme.
#
# The row is a `dsh.client` roster entry the browser roster scanner turns into
# window.__DSH_BOOT__; the plugin package is this bundle's dependency, so the
# profile's node resolution finds it for the browser registry.

- insert:
    - id: ui-matrix-theme
      name: '@deepseek-ai/dsh-client-ui-matrix-theme'
